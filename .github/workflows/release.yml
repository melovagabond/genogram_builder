name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.32.0'
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ------------------------------------------------------------------
  # Android: APKs (split-per-abi + universal) and AAB
  # ------------------------------------------------------------------
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/genogram_builder-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/genogram_builder-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/genogram_builder-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk             dist/genogram_builder-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab          dist/genogram_builder.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  # ------------------------------------------------------------------
  # Web build (zipped)
  # ------------------------------------------------------------------
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Zip web build
        run: |
          mkdir -p dist
          cd build/web
          zip -r ../../dist/genogram_builder-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  # ------------------------------------------------------------------
  # Linux desktop build (zipped)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Zip Linux bundle
        run: |
          mkdir -p dist
          cd build/linux/x64/release/bundle
          zip -r ../../../../../dist/genogram_builder-linux-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ------------------------------------------------------------------
  # Windows desktop build (zipped)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/genogram_builder-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # ------------------------------------------------------------------
  # macOS desktop build (zipped .app)
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Zip macOS .app
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -n1)
          zip -r "../../../../../dist/genogram_builder-macos.zip" "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # ------------------------------------------------------------------
  # Aggregate artifacts and publish GitHub Release
  # ------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-android, build-web, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp -v {} dist/ \;
          ls -lah dist

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/*
