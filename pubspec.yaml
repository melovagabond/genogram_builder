name: genogram_builder
description: A clinical genogram builder with full Bowen standard symbols.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
